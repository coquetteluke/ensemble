name: Ensemble
options:
  bundleIdPrefix: com.coquetteluke
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  EnsembleKit:
    path: Packages/EnsembleKit
targets:
  Ensemble:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac
    dependencies:
      - package: EnsembleKit
      # The agent tools helper, in Contents/MacOS next to the app (`AgentToolsBridge`).
      - target: EnsembleAgentTools
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coquetteluke.ensemble
        PRODUCT_NAME: Ensemble
        INFOPLIST_KEY_CFBundleDisplayName: Ensemble
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ensemble uses the microphone when you dictate a message."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Ensemble turns your dictation into text in the message box."
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # `ensemble-agent-tools`: the stdio MCP server engines start; it relays to the app's private socket.
  EnsembleAgentTools:
    type: tool
    platform: macOS
    sources:
      - path: Apps/AgentToolsBridge
      - path: Packages/EnsembleKit/Sources/EnsembleKit/AgentTools/AgentToolsBridge.swift
    settings:
      base:
        PRODUCT_NAME: ensemble-agent-tools
        PRODUCT_BUNDLE_IDENTIFIER: com.coquetteluke.ensemble.agent-tools
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
  # "Install Ensemble": the graphical installer on the disk image. scripts/make-installer.sh puts the built
  # Ensemble.app into its Resources. It compiles three EnsembleKit files directly and links nothing else.
  EnsembleInstaller:
    type: application
    platform: macOS
    sources:
      - path: Apps/Installer
      - path: Apps/Mac/Assets.xcassets
      - path: Packages/EnsembleKit/Sources/EnsembleKit/Engine/EngineSetup.swift
      - path: Packages/EnsembleKit/Sources/EnsembleKit/Install/AppInstaller.swift
      - path: Packages/EnsembleKit/Sources/EnsembleKit/Install/EngineInstaller.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coquetteluke.ensemble.installer
        PRODUCT_NAME: Install Ensemble
        INFOPLIST_KEY_CFBundleDisplayName: Install Ensemble
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  EnsembleRemote:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
    dependencies:
      - package: EnsembleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coquetteluke.ensemble.remote
        PRODUCT_NAME: Ensemble Remote
        INFOPLIST_KEY_CFBundleDisplayName: Ensemble
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the pairing code shown on your Mac or take photos to attach to messages."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to Ensemble on your Mac."
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Ensemble:
    build:
      targets:
        Ensemble: all
    run:
      config: Debug
  EnsembleInstaller:
    build:
      targets:
        EnsembleInstaller: all
    run:
      config: Debug
  EnsembleRemote:
    build:
      targets:
        EnsembleRemote: all
    run:
      config: Debug
