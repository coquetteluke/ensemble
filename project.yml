name: Ensemble
options:
  bundleIdPrefix: com.coquetteluke
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  EnsembleKit:
    path: Packages/EnsembleKit
targets:
  Ensemble:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac
    dependencies:
      - package: EnsembleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coquetteluke.ensemble
        PRODUCT_NAME: Ensemble
        INFOPLIST_KEY_CFBundleDisplayName: Ensemble
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  EnsembleRemote:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
    dependencies:
      - package: EnsembleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coquetteluke.ensemble.remote
        PRODUCT_NAME: Ensemble Remote
        INFOPLIST_KEY_CFBundleDisplayName: Ensemble
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the pairing code shown on your Mac."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to Ensemble on your Mac."
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Ensemble:
    build:
      targets:
        Ensemble: all
    run:
      config: Debug
  EnsembleRemote:
    build:
      targets:
        EnsembleRemote: all
    run:
      config: Debug
